[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "freezing-nq"
version = "0.4.3"
description = "Freezing Saddles activity receive and enqueue worker"
readme = "README.md"
authors = [
    {name = "Hans Lellelid", email = "hans@xmpl.org"},
    {name = "Richard Bullington-McGuire", email = "richard.bullington.mcguire@gmail.com"},
]
maintainers = [
    {name = "Richard Bullington-McGuire", email="richard.bullington.mcguire@gmail.com"},
]
license = {text = "Apache License (2.0)"}
dependencies = [
    "arrow==1.4.0",
    "envparse==0.2.0",
    "falcon==4.3.1",
    "freezing-model @ https://github.com/freezingsaddles/freezing-model/archive/0.13.0.tar.gz",
    "greenstalk==2.1.1",
    "gunicorn==26.2.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Games",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Natural Language :: English",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "black==26.5.1",
    "fawltydeps==0.20.0",
    "flake8==7.3.0",
    "flake8-bugbear==26.9.9",
    "flake8-builtins==3.1.0",
    "flake8-comprehensions==3.17.0",
    "flake8-docstrings==1.7.0",
    "flake8-eradicate==1.5.0",
    "flake8-print==5.0.0",
    "flake8-pyproject==1.2.4",
    "flake8-raise==0.0.5",
    "flake8-return==1.2.0",
    "flake8-simplify==0.30.0",
    "flake8-sorted-keys==0.2.0",
    "flake8-todo==0.7",
    "isort==9.0.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
]

[tool.fawltydeps]
# Dev tools and flake8 plugins are run, never imported; gunicorn is the
# container entrypoint; freezing-model is a namespace package fawltydeps
# cannot map to its imports.
ignore_unused = [
    "bandit",
    "black",
    "fawltydeps",
    "flake8",
    "flake8-bugbear",
    "flake8-builtins",
    "flake8-comprehensions",
    "flake8-docstrings",
    "flake8-eradicate",
    "flake8-print",
    "flake8-pyproject",
    "flake8-raise",
    "flake8-return",
    "flake8-simplify",
    "flake8-sorted-keys",
    "flake8-todo",
    "freezing-model",
    "gunicorn",
    "isort",
    "mypy",
    "pytest-mock",
]

[tool.isort]
profile = "black"

[tool.flake8]
# Thanks https://www.reddit.com/r/learnpython/comments/rr6y69/comment/hqeqt68/?utm_source=share&utm_medium=web2x&context=3
ignore = [
    "E203",
    "E501",
    "W503",
]
max-line-length = 88
max-complexity = 39
extend-ignore = "E203"
inline-quotes = "double"
